<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StepSnap – Screen Capture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f13;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      text-align: center;
      padding: 32px;
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .state-card {
      background: #1e1e2e;
      border: 1px solid #2d2d3f;
      border-radius: 16px;
      padding: 32px 40px;
      max-width: 480px;
      width: 100%;
    }

    .status-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }
    .status-dot.active { background: #22c55e; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
    p  { font-size: 0.9rem; color: #94a3b8; line-height: 1.6; }

    #start-btn {
      margin-top: 24px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      width: 100%;
    }
    #start-btn:hover   { opacity: 0.9; }
    #start-btn:active  { transform: scale(0.98); }
    #start-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #error-msg {
      margin-top: 16px;
      color: #f87171;
      font-size: 0.85rem;
      display: none;
    }

    video {
      display: none; /* Hidden – used only for canvas snapshots */
    }
  </style>
</head>
<body>
  <div class="logo">StepSnap</div>

  <div class="state-card">
    <h2 id="status-text"><span class="status-dot" id="dot"></span>Waiting for permission…</h2>
    <p id="subtitle">Click below to share your screen. StepSnap will capture a screenshot each time you interact with any app.</p>

    <button id="start-btn">Share My Screen</button>
    <p id="error-msg"></p>
  </div>

  <video id="preview" muted playsinline></video>

  <script src="capture.js"></script>
</body>
</html>
