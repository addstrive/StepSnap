<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StepSnap</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f13;
      color: #e2e8f0;
      width: 300px;
      padding: 20px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .logo-mark {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .logo-text {
      font-weight: 700;
      font-size: 1.1rem;
    }
    .logo-sub {
      font-size: 0.7rem;
      color: #64748b;
      font-weight: 400;
    }

    /* Status pill */
    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e1e2e;
      border: 1px solid #2d2d3f;
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 16px;
      transition: all 0.3s;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .status-pill.recording {
      border-color: #22c55e40;
      background: #052e1640;
    }
    .status-pill.recording .status-dot {
      background: #22c55e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 #22c55e60; }
      50%       { box-shadow: 0 0 0 4px #22c55e00; }
    }

    /* Step counter */
    .step-counter {
      background: #1e1e2e;
      border: 1px solid #2d2d3f;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .step-counter .label { font-size: 0.8rem; color: #64748b; }
    .step-counter .count {
      font-size: 1.5rem;
      font-weight: 700;
      color: #a78bfa;
      line-height: 1;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-bottom: 8px;
    }
    .btn:last-child { margin-bottom: 0; }
    .btn:active     { transform: scale(0.98); }
    .btn:disabled   { opacity: 0.35; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }
    .btn-primary:not(:disabled):hover { opacity: 0.88; }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #fff;
    }
    .btn-danger:not(:disabled):hover { opacity: 0.88; }

    .btn-ghost {
      background: #1e1e2e;
      color: #94a3b8;
      border: 1px solid #2d2d3f;
      font-size: 0.8rem;
    }
    .btn-ghost:not(:disabled):hover { background: #2d2d3f; color: #e2e8f0; }

    /* Tip */
    .tip {
      margin-top: 14px;
      font-size: 0.73rem;
      color: #475569;
      line-height: 1.5;
      text-align: center;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.8rem;
      margin-bottom: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-mark">✍</div>
    <div>
      <div class="logo-text">StepSnap</div>
      <div class="logo-sub">Auto guide recorder</div>
    </div>
  </div>

  <div class="status-pill" id="status-pill">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Ready to record</span>
  </div>

  <div class="step-counter" id="step-counter" style="display:none">
    <span class="label">Steps captured</span>
    <span class="count" id="step-count">0</span>
  </div>

  <p class="error-msg" id="error-msg"></p>

  <button class="btn btn-primary" id="start-btn">▶ Start Recording</button>
  <button class="btn btn-danger"  id="stop-btn"  disabled>⏹ Stop &amp; Generate Guide</button>
  <button class="btn btn-ghost"   id="view-btn"  style="display:none">📋 View Last Guide</button>

  <p class="tip" id="tip-text">Click Start, then share your screen to begin capturing steps.</p>

  <script src="popup.js"></script>
</body>
</html>
